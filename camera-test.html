<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEZPO - Test QR caméra</title>
<style>
body{font-family:system-ui;background:#f5f7f4;color:#16211a;margin:0}
main{max-width:520px;margin:auto;padding:28px 20px}
.card{background:#fff;border:1px solid #dde5df;border-radius:24px;padding:22px}
input,button{width:100%;box-sizing:border-box;padding:15px;border-radius:14px;font:inherit;margin:7px 0 14px}
input{border:1px solid #cbd7ce}
button{border:0;background:#123b29;color:#fff;font-weight:800}
#qrbox{display:none;text-align:center;margin-top:22px}
#qr img{max-width:100%;height:auto}
small{color:#8a5a00}
</style>
</head>
<body>
<main>
<h2>PEZPO</h2>
<h1>Test provisioning caméra</h1>
<div class="card">
<label>Wi‑Fi de test</label>
<input id="ssid" value="TEST-WIFI">
<label>Mot de passe de test</label>
<input id="psk" type="password" value="TEST123456">
<button id="go">GÉNÉRER LE QR PEZPO</button>
<small>N'utilise pas encore ton vrai mot de passe Wi‑Fi.</small>
<div id="qrbox"><h2>Présente ce QR à la caméra</h2><div id="qr"></div></div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function b64url(s){
 const bytes=new TextEncoder().encode(s); let bin="";
 for(const b of bytes) bin+=String.fromCharCode(b);
 return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
document.getElementById("go").onclick=()=>{
 const ssid=document.getElementById("ssid").value.trim();
 const psk=document.getElementById("psk").value;
 if(!ssid||!psk){alert("SSID et mot de passe requis");return;}
 const r=crypto.getRandomValues(new Uint32Array(2));
 const payload={v:1,hub:"PZ-HUB-002",ssid,psk,nonce:r[0].toString(16)+r[1].toString(16)};
 const data="PEZPO_WIFI1:"+b64url(JSON.stringify(payload));
 const box=document.getElementById("qr"); box.innerHTML="";
 new QRCode(box,{text:data,width:340,height:340,correctLevel:QRCode.CorrectLevel.M});
 document.getElementById("qrbox").style.display="block";
};
</script>
</body>
</html>
